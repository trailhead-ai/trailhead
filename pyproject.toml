[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trailhead"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []

# Dev-only tooling — never installed as a runtime dependency (see dependencies =
# [] above and the zero-third-party-dependency posture in CLAUDE.md). Declared
# here as the standard, tool-discoverable `pip install -e .[dev]` extra;
# `.envrc` and the CI pytest job provision the same packages directly (pinned
# in CI, matching the `ruff==` pin style) rather than reading this extra, so a
# version bump here doesn't silently drift what local/CI runs actually use.
[project.optional-dependencies]
dev = ["pytest", "pytest-xdist"]

[project.scripts]
trailhead = "trailhead.cli:main"

[tool.setuptools]
packages = ["trailhead", "trailhead.vcs", "trailhead.harness"]

[tool.pytest.ini_options]
testpaths = [
    "trailhead/tests",
    "tools/lore/tests",
    "tools/craft/tests",
    "tools/camp/tests",
    "tools/portage/tests",
    "tools/outpost/tests",
    "tools/ranger/tests",
]
# -n auto: parallelize across all available cores (pytest-xdist). The suite is
# I/O-bound on subprocess + filesystem work, not CPU-bound, so this scales
# with whatever machine runs it (dev laptop or a smaller CI runner) without a
# fixed worker count that's wrong on one of them.
addopts = "-n auto"
markers = [
    "real_home: the test genuinely means the developer's real home; opts out of the Path.home() guard",
]

[tool.ruff]
# PEP 8 style enforcement. PEP 8 explicitly allows teams to relax the 79-column
# rule; this codebase de-facto targets <=100, so we enforce 120 rather than churn
# every carefully-wrapped docstring.
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# E/W = pycodestyle (the PEP 8 checker), F = pyflakes (unused imports/vars, etc.).
select = ["E", "W", "F"]
