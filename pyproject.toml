[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trailhead"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
trailhead = "trailhead.cli:main"

[tool.setuptools]
packages = ["trailhead", "trailhead.vcs", "trailhead.harness"]

[tool.pytest.ini_options]
testpaths = [
    "trailhead/tests",
    "tools/lore/tests",
    "tools/craft/tests",
    "tools/camp/tests",
    "tools/portage/tests",
    "tools/outpost/tests",
]
# -n auto: parallelize across all available cores (pytest-xdist). The suite is
# I/O-bound on subprocess + filesystem work, not CPU-bound, so this scales
# with whatever machine runs it (dev laptop or a smaller CI runner) without a
# fixed worker count that's wrong on one of them. `-m "not benchmark"` excludes
# timing/latency assertions from the parallel run — worker contention makes
# wall-clock latency meaningless, not the benchmark broken; those run serially
# as a dedicated CI step instead (see .github/workflows/tests.yml).
addopts = "-n auto -m \"not benchmark\""
markers = [
    "real_home: the test genuinely means the developer's real home; opts out of the Path.home() guard",
    "benchmark: a timing/latency assertion that requires uncontended CPU — excluded from the parallel run, run serially instead",
]

[tool.ruff]
# PEP 8 style enforcement. PEP 8 explicitly allows teams to relax the 79-column
# rule; this codebase de-facto targets <=100, so we enforce 120 rather than churn
# every carefully-wrapped docstring.
line-length = 120
target-version = "py311"
# Frozen reference snapshots used only as differential-test fixtures, loaded
# by path rather than imported — not maintained source, so not linted.
extend-exclude = ["tools/craft/tests/fixtures/candidate_set_pre_linear_fix_baseline.py"]

[tool.ruff.lint]
# E/W = pycodestyle (the PEP 8 checker), F = pyflakes (unused imports/vars, etc.).
select = ["E", "W", "F"]
