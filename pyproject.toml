[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trailhead"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
trailhead = "trailhead.cli:main"

[tool.setuptools]
packages = ["trailhead", "trailhead.vcs", "trailhead.harness"]

[tool.pytest.ini_options]
testpaths = [
    "trailhead/tests",
    "tools/lore/tests",
    "tools/craft/tests",
    "tools/camp/tests",
    "tools/portage/tests",
    "tools/outpost/tests",
    "tools/ranger/tests",
]

[tool.ruff]
# PEP 8 style enforcement. PEP 8 explicitly allows teams to relax the 79-column
# rule; this codebase de-facto targets <=100, so we enforce 120 rather than churn
# every carefully-wrapped docstring.
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# E/W = pycodestyle (the PEP 8 checker), F = pyflakes (unused imports/vars, etc.).
select = ["E", "W", "F"]
