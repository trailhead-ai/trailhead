[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trailhead"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
trailhead = "trailhead.cli:main"

[tool.setuptools]
packages = ["trailhead", "trailhead.vcs"]

[tool.pytest.ini_options]
testpaths = [
    "trailhead/tests",
    "tools/lore/tests",
    "tools/forge/tests",
    "tools/camp/tests",
]
