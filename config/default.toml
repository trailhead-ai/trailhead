# Default trailhead install config — "install everything".
#
# `trailhead install` uses this when no --config is given. It installs all three
# CLIs and all agent-plugins into whatever harness is detected (or named with
# --harness). Drop your own *.toml files in this directory to customize an
# install; everything here except this file is gitignored, so your configs never
# create git noise in a checkout.
#
# See trailhead/install_config.py for the full schema (per-harness blocks,
# per-plugin subagent/skill selection, and file_path overrides).

install_camp_cli = true
install_lore_cli = true
install_portage_cli = true

# Top-level default plugin set, applied to every detected/--harness harness.
# A [[harness]] block (omitted here) can override this per harness.
plugins = ["camp", "lore", "craft", "portage", "outpost", "trailhead"]

# Disable the SessionStart self-update-notice hook the `trailhead` plugin
# ships (see tools/trailhead/plugins/trailhead/hooks/). Also overridable per
# session with the TRAILHEAD_DISABLE_UPDATE_CHECK environment variable, which
# always wins over this key.
session_start_update_check = true
