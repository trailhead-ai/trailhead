# Agent filenames reflect CURRENT on-disk names (advocate/builder/breaker/attacker, assumption-prover, executor).
# Circle agents renamed to bare names in Spec A / Slice 1; SDD agents renamed in Slice 3.

[tool]
name = "forge"
base = ["skills/handoff", "skills/pickup", "skills/followup"]

[capabilities.planning]
description = "Turn fuzzy ideas into specs and implementation plans — planner and architect subagents."
skills = ["skills/planning"]
agents = ["agents/planner.md", "agents/architect.md"]

[capabilities.execute]
description = "TDD subagent-driven implementation, slice by slice — assumption-prover and executor subagents."
skills = ["skills/execute"]
agents = ["agents/assumption-prover.md", "agents/executor.md"]

[capabilities.review]
description = "Structured code review of completed work — code-reviewer subagent dispatched after implementation."
skills = ["skills/requesting-code-review"]
agents = ["agents/code-reviewer.md"]

[capabilities.circle]
description = "Four-lens review panel — builder, reliability, security, and user-advocate perspectives on a diff."
skills = ["skills/consult"]
agents = [
  "agents/advocate.md",
  "agents/builder.md",
  "agents/breaker.md",
  "agents/attacker.md",
]

[capabilities.design]
description = "Design-doc authoring — structured spec and design artifacts."
skills = []
agents = ["agents/artist.md"]

[capabilities.release]
description = "Release rituals — PR lifecycle, CI watch, merge ordering, and post-merge soak for a camp group."
skills = [
  "skills/create-pr",
  "skills/update-pr",
  "skills/watch-pr",
  "skills/watch-preview",
  "skills/merge-pr",
  "skills/github-pr",
  "skills/post-merge-decide",
]
agents = [
  "agents/pr-updater.md",
  "agents/watch-pr.md",
  "agents/watch-preview.md",
  "agents/diagnose-preview.md",
]

[capabilities.helpers]
description = "Cheap specialist subagents for docs, logs, PRs, research, troubleshooting, tests, and security review."
skills = []
agents = [
  "agents/doc-finder.md",
  "agents/log-sifter.md",
  "agents/pr-summarizer.md",
  "agents/researcher.md",
  "agents/troubleshooter.md",
  "agents/test-runner.md",
  "agents/security-auditor.md",
  "agents/forge-ping.md",
]
