# camp group config for the trailhead fleet.
#
# The trailhead group spans three sibling repos worked on together:
#   - trailhead              the monorepo (lore, craft, camp live inside as tools/<name>/)
#   - trailhead-ai.github.io the marketing / docs site
#   - outpost               the companion app repo
#
# This file is an EXAMPLE / template. The repo_root values below are
# placeholders — replace each `/path/to/<repo>` with the absolute path to your
# own clone before copying this into your live config
# (config_dir("camp")/groups/trailhead.toml). camp also authors this file for
# you: `camp group trailhead --member trailhead=/path/to/trailhead --member ...`.
#
# Each repo must belong to exactly one group (camp enforces no-overlap).
#
# [dev_env] is intentionally absent — dev-env capability is deferred.
# See deferred/2026-06/2026-06-09-camp-dev-env-engine-half for the revive trigger.

[group]
name = "trailhead"

[[members]]
name = "trailhead"
repo_root = "/path/to/trailhead"
# trailhead is reached via sys.path (walk-up from cli/camp), not pip install.
# No build step is needed for import resolution on a fresh git clone.
bootstrap = []

[[members]]
name = "trailhead-ai.github.io"
repo_root = "/path/to/trailhead-ai.github.io"
bootstrap = []

[[members]]
name = "outpost"
repo_root = "/path/to/outpost"
bootstrap = []

[branch]
pattern = "worktree-{slug}"

# [harness] — optional launch-seam config.
#
# camp defaults to the claude harness (writes CLAUDE.md as the workspace doc).
# Override doc_files when using a different AI coding tool:
#
#   [harness]
#   # For Codex, Copilot, or Cursor — they read AGENTS.md as the workspace doc.
#   # doc_files = ["AGENTS.md"]
#
# You can also supply both to support multiple tools simultaneously:
#   # doc_files = ["AGENTS.md", "CLAUDE.md"]
