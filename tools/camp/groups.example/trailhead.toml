# camp group config for the trailhead fleet.
#
# The trailhead group spans three sibling repos worked on together:
#   - trailhead              the monorepo (lore, craft, camp live inside as tools/<name>/)
#   - trailhead-ai.github.io the marketing / docs site
#   - outpost               the companion app repo
#
# This file is an EXAMPLE / template. The repo_root values below are
# placeholders — replace each `/path/to/<repo>` with the absolute path to your
# own clone before copying this into your live config
# (config_dir("camp")/groups/trailhead.toml). camp also authors this file for
# you: `camp group trailhead --member trailhead=/path/to/trailhead --member ...`.
#
# Each repo must belong to exactly one group (camp enforces no-overlap).
#
# [dev_env] is intentionally absent — dev-env capability is deferred.
# See deferred/2026-06/2026-06-09-camp-dev-env-engine-half for the revive trigger.

[group]
name = "trailhead"

[[members]]
name = "trailhead"
repo_root = "/path/to/trailhead"
# trailhead is reached via sys.path (walk-up from cli/camp), not pip install.
# No build step is needed for import resolution on a fresh git clone.
bootstrap = []
# Build a code-review-graph knowledge graph in each new worktree (see the
# [tasks.code-review-graph] block below). Referenced by name; opt-in per member.
tasks = ["code-review-graph", "mcp-config"]

[[members]]
name = "trailhead-ai.github.io"
repo_root = "/path/to/trailhead-ai.github.io"
bootstrap = []

[[members]]
name = "outpost"
repo_root = "/path/to/outpost"
bootstrap = []

[branch]
pattern = "worktree-{slug}"

# [tasks.<name>] — group-level named, multi-step member tasks (referenced per
# member via `tasks = [...]`). Steps are argv lists (shell=False, author-trusted
# local input) with {repo_root}/{worktree}/{workspace}/{slug} placeholders.
#
# phase          "provision" (default) runs when a worktree is created and on
#                each SessionStart reconcile; "activate" runs on first
#                `camp activate`. Completion is recorded per member in the
#                central manifest, so a task that finished "ok" is never re-run —
#                only failed/never-run tasks execute (run-once-on-success).
# required       false (default) → a failure records state + prints a one-line
#                `camp status` warning and continues; true → failure is fatal.
# timeout_seconds  per-step subprocess timeout (positive int; runner default
#                otherwise).
#
# code-review-graph builds a knowledge graph of the worktree so review agents can
# query it. A full `build` (not incremental `update`) is used deliberately: it
# re-parses every file and roots every node's path at {worktree}, so there is no
# stale base commit and no stale file paths. The full-parse cost is paid once per
# member per workspace via run-once-on-success semantics, not per session.
#
# Requires the `code-review-graph` CLI on PATH. Opt in per member (see the
# trailhead member above); a member with no graph should simply not reference it.
[tasks.code-review-graph]
phase = "provision"
required = false
timeout_seconds = 1800

[[tasks.code-review-graph.steps]]
name = "build"
cmd = ["code-review-graph", "build", "--repo", "{worktree}"]

# mcp-config copies the repo root's `.mcp.json` into the new worktree.
# `.mcp.json` is gitignored, so a fresh worktree checkout never has it — without
# this step every camp workspace is missing the MCP server config the repo's
# own agents are told to use, and silently falls back to slower tools.
#
# Copy, don't regenerate: `code-review-graph install` emits a `uvx`-based
# command that never completes the MCP stdio handshake. The repo-root
# `.mcp.json` already points at the resolved binary.
[tasks.mcp-config]
phase = "provision"
required = false

[[tasks.mcp-config.steps]]
name = "copy"
cmd = ["cp", "{repo_root}/.mcp.json", "{worktree}/.mcp.json"]

# [harness] — optional harness-profile config (doc surfacing, injection, trust).
#
# camp defaults to the claude harness (writes CLAUDE.md as the workspace doc).
# Override doc_files when using a different AI coding tool:
#
#   [harness]
#   # For Codex, Copilot, or Cursor — they read AGENTS.md as the workspace doc.
#   # doc_files = ["AGENTS.md"]
#
# binary — the harness binary NAME (default "claude"). camp does not launch it;
#   only its basename is read, to detect a claude launch and scope the trust
#   pre-seed below. Set it for a renamed/wrapped claude binary, or leave default.
#   # binary = "claude"
#
# You can also supply both to support multiple tools simultaneously:
#   # doc_files = ["AGENTS.md", "CLAUDE.md"]
#
# inject — mid-session context-injection strategy for `camp activate`.
#   "stdout"      print the member doc to stdout (universal floor; works with any
#                 harness, including Aider).
#   "claude-hook" enqueue the member doc for the Claude Code PostToolUse hook so it
#                 loads silently into context on the next turn (no visible-log
#                 clutter). camp wires the PostToolUse hook automatically.
# Default: claude (no [harness] block) → "claude-hook"; ANY [harness] block without
# an explicit inject → "stdout" (safe default for a non-claude harness).
#   # inject = "claude-hook"
#
# pretrust — pre-seed the Claude Code per-directory trust flag in ~/.claude.json
#   for the workspace launch dir, so `camp ai` does not stall on the "Do you trust
#   the files in this folder?" dialog. Applies only to claude launches; best-effort
#   (a failure simply lets the dialog reappear). Default: true. Opt out with:
#   # pretrust = false
