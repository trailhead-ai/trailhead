# camp group config for the trailhead monorepo.
#
# The trailhead group has one member: the trailhead repo itself.
# lore, forge, and camp live inside it as tools/<name>/, not as separate member repos.
#
# Multi-member lifecycle is validated via synthetic 2-member test fixtures (see
# tools/camp/tests/). The 1-member trailhead group serves as the live smoke test.
#
# [dev_env] is intentionally absent — dev-env capability is deferred.
# See deferred/2026-06/2026-06-09-camp-dev-env-engine-half for the revive trigger.

[group]
name = "trailhead"

[[members]]
name = "trailhead"
repo_root = "/Users/tduffield/code/trailhead"
# trailhead is reached via sys.path (walk-up from cli/camp), not pip install.
# No build step is needed for import resolution on a fresh git clone.
bootstrap = []

[branch]
pattern = "worktree-{slug}"
