[tool]
name = "lore"
base = ["skills/_shared", "skills/sync", "skills/ping"]
hooks_json = "hooks/hooks.json"

[capabilities.capture]
description = "Capture decisions, dead-ends, deferrals, follow-ups, area notes, and intake seeds into the vault."
skills = [
  "skills/decision",
  "skills/dead-end",
  "skills/defer",
  "skills/follow-up",
  "skills/check-in",
  "skills/area",
  "skills/seed",
  "skills/brainstorm",
]
agents = []

[capabilities.recall]
description = "Surface, re-justify, and synthesize accumulated vault memory — tend rituals, reflections, and librarian lookups."
skills = ["skills/tend", "skills/reflect"]
agents = ["agents/librarian.md"]

[capabilities.sessions]
description = "Session lifecycle — checkpoint mid-session state and finalize on close."
skills = ["skills/checkpoint", "skills/finish"]
agents = []

[capabilities.shared-vaults]
description = "Layered personal + shared vaults — compose lore across team members (WS-9, not yet built)."
skills = []
agents = []
