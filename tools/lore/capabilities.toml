# lore — agent-native project memory.
# Selectable skills are discovered from skills/*/ (those with a SKILL.md);
# selectable subagents from agents/*.md. No capability groups — install selects
# subagents/skills by name (see trailhead/install_config.py).
#
# skills/_shared ships always (base): it holds VAULT_WRITE_PATTERN.md, referenced
# at runtime by the capture skills, and has no SKILL.md so it is never selectable.

[tool]
name = "lore"
base = ["skills/_shared"]
hooks_json = "hooks/hooks.json"
