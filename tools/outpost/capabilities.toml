# outpost — publishing static sites into a shared lore vault, for the local
# outpost cockpit daemon to serve.
# tool.name MUST equal the plugins/<name>/ dir ("outpost").
# No python package, no subagents, no always-on base. The skills (skills/*/) are
# discovered on disk by name: `publish-site` runs a script bundled beside it, and
# `ruleset` carries the always-loaded publish posture that makes the sites
# capability discoverable before a user thinks to ask for it.

[tool]
name = "outpost"
ruleset = "rules.md"
