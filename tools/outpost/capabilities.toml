# outpost — the human→agent review loop over the local outpost cockpit daemon.
# tool.name MUST equal the plugins/<name>/ dir ("outpost").
# No python package, no subagents, no always-on base. The skills (skills/*/) are
# pure-HTTP contracts, discovered on disk by name; `ruleset` carries the
# always-loaded publish posture that makes the sites capability discoverable
# before a user thinks to ask for it.

[tool]
name = "outpost"
ruleset = "rules.md"
