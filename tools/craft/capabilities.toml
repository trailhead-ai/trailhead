# craft — software-development rituals + agents.
# Selectable skills are discovered from skills/*/ (those with a SKILL.md);
# selectable subagents from agents/*.md. No capability groups — install selects
# subagents/skills by name (see trailhead/install_config.py).
#
# skills/_shared ships always (base): it holds council.md (the review-panel roster
# + dispatch contract) read at runtime by the plan and consult skills, and has no
# SKILL.md so it is never selectable.

[tool]
name = "craft"
base = ["skills/_shared"]
