# craft — software-development rituals + agents.
# Selectable skills are discovered from skills/*/ (those with a SKILL.md);
# selectable subagents from agents/*.md. No capability groups — install selects
# subagents/skills by name (see trailhead/install_config.py).
#
# Two directories ship always (base), because both hold files that shipped skills
# READ at runtime — omit either and a selected skill points at a path that is not
# there:
#   - skills/_shared — council.md (the review-panel roster + dispatch contract), read
#     by the plan, consult, and gauntlet skills; status-ownership.md (the task-status
#     ownership contract, read by execute); refine.md (the standalone-task
#     promotion procedure), read by the refine skill and by execute's inline run; and
#     note-storage.md (the plan/spec persistence seam, read by brainstorm, plan,
#     polish, and agents/planner.md). It has no SKILL.md, so it is never selectable.
#   - templates — the spec/plan/task body templates, resolved at runtime through
#     ${CLAUDE_PLUGIN_ROOT}/templates/<name>.md by brainstorm (spec.md), plan
#     (plan.md + task.md), and refine (task.md's payload labels + plan.md's Flow-out
#     checklist). They are runtime inputs to those skills, not install-time
#     scaffolding, which is why selection cannot drop them.
#
# Dependency worth knowing when hand-picking a selection: the `gauntlet` skill owns
# the spec's draft -> ready edge (brainstorm and plan deliberately cannot freeze a
# spec). A selection carrying `brainstorm` or `plan` but NOT `gauntlet` therefore
# deadlocks the spec lifecycle — nothing installed can freeze a spec. The gauntlet
# also dispatches the `premise-attacker`, `consistency-auditor`, and
# `divergence-prober` subagents plus the four council lenses; omitting any of them
# makes the skill halt rather than run a degraded review. The default config selects
# the whole plugin, so this only bites a hand-written subset.

[tool]
name = "craft"
base = ["skills/_shared", "templates"]
