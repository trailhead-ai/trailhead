# Pre-commit hooks for trailhead.
#
# One-time setup (per clone):
#   pip install pre-commit
#   pre-commit install                       # installs the pre-commit (lint) hook
#   pre-commit install --hook-type commit-msg  # installs the conventional-commit hook
#
# `default_install_hook_types` below makes a bare `pre-commit install` wire up
# BOTH stages, so the two-line install collapses to one.
default_install_hook_types: [pre-commit, commit-msg]

repos:
  # Enforce Conventional Commits on the commit message (commit-msg stage).
  # Matches the repo convention: feat(scope):, fix(scope):, refactor(scope):,
  # docs(...), test(...), chore(...), etc.
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]

  # Leak gate — refuse a commit that would ship a private string on a plugin
  # surface. Structural seams are committed (scripts/leak-gate-seams.denylist);
  # identifying tokens live in a machine-local denylist that is layered on when
  # present, so a fresh clone without one is not blocked.
  - repo: local
    hooks:
      - id: leak-gate
        name: leak gate (no private strings on the shippable surface)
        language: system
        entry: scripts/leak-gate
        pass_filenames: false
        always_run: true

  # Agent cost-tier gate — refuse an agent that leaves `model:` or `effort:` to
  # inheritance. Runs only on the agent files a commit actually touches;
  # trailhead/tests/test_agent_tier_convention.py runs the same gate over the
  # whole tree, so a commit and a suite run cannot disagree.
  - repo: local
    hooks:
      - id: agent-tier-gate
        name: agent tier gate (every agent declares model + effort)
        language: system
        entry: scripts/agent-tier-gate
        files: ^tools/[^/]+/plugins/[^/]+/agents/.*\.md$

  # Inert-test gate — refuse a test that asserts without running its subject.
  # Runs only on the test files a commit touches; the whole-tree run lives in
  # trailhead/tests/test_inert_test_gate.py, so a commit and a suite run agree.
  - repo: local
    hooks:
      - id: inert-test-gate
        name: inert test gate (every test executes its subject)
        language: system
        entry: scripts/inert-test-gate
        files: (^|/)test_[^/]*\.py$

  # PEP 8 style enforcement via ruff (pycodestyle E/W + pyflakes F).
  # Rules and line-length are configured in pyproject.toml ([tool.ruff]).
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.17
    hooks:
      - id: ruff
        args: [--fix]
