# landing_claims.toml — tracked, typed claims manifest for the Trailhead landing.
#
# Every load-bearing anchor the landing prose names is registered here.
# The link-real gate (test_landing_links_real.py) resolves each [[claim]] against
# the real source of truth and fails closed if any anchor is unresolved or stale.
#
# Schema: array-of-tables [[claim]] with four required fields:
#   kind    — one of: command | skill | agent | doc-link
#             prose-assertion exceptions (not resolved by the gate):
#               positioning | allowlisted-example
#   tool    — trailhead | lore | craft | camp | portage | landing
#   ref     — the anchor to resolve (subcommand name, path, etc.)
#   source  — which README/surface makes this claim: root | lore | craft | camp | portage | landing
#
# The capability-GROUP and install-PRESET concepts were removed: install is now
# config-driven and selects subagents/skills by name. Skill/agent anchors resolve
# against the convention-discovered plugin inventory (Manifest.skills / .subagents).

# ---------------------------------------------------------------------------
# CLI subcommands (kind=command) — the three real commands: install/uninstall/doctor
# ---------------------------------------------------------------------------

[[claim]]
kind = "command"
tool = "trailhead"
ref = "install"
source = "root"

[[claim]]
kind = "command"
tool = "trailhead"
ref = "uninstall"
source = "root"

[[claim]]
kind = "command"
tool = "trailhead"
ref = "doctor"
source = "root"

