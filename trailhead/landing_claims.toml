# landing_claims.toml — tracked, typed claims manifest for the Trailhead landing.
#
# Every load-bearing anchor the landing prose names is registered here.
# The link-real gate (test_landing_links_real.py) resolves each [[claim]] against
# the real source of truth and fails closed if any anchor is unresolved or stale.
#
# Schema: array-of-tables [[claim]] with four required fields:
#   kind    — one of: command | preset | skill | agent | capability | doc-link
#             prose-assertion exceptions (not resolved by the gate):
#               positioning | allowlisted-example
#   tool    — trailhead | lore | forge | camp | portage | landing
#   ref     — the anchor to resolve (subcommand name, path, capability name, etc.)
#   source  — which README/surface makes this claim: root | lore | forge | camp | portage | landing
#
# Slice 3 extended this with per-tool README anchors (lore/forge/portage).
# Slice 4 extended this with the landing tool README anchors.

# ---------------------------------------------------------------------------
# CLI subcommands (kind=command)
# ---------------------------------------------------------------------------

[[claim]]
kind = "command"
tool = "trailhead"
ref = "install"
source = "root"

