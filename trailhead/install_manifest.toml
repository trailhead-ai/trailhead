# Trailhead install manifest
#
# Each [[repo]] entry describes a suite component.  Two kinds:
#   - remote: pinned at a full 40-char commit SHA, fetched + GPG-verified.
#       * rev must be exactly 40 lowercase hex chars (never a tag, short SHA, HEAD, 'latest')
#       * source may use ${registry} (resolved against `trailhead config registry`) or a
#         fully-qualified https:// or git@host:path URL for per-repo mirrors
#       * Integrity (Slice 2): the installed repo's HEAD must match the pinned rev, and
#         git verify-commit is checked against the signing key (74AEB40C93C4250A) before wiring.
#   - local-self (L-1): source = "local" installs the working tree you are running from,
#       tracking HEAD.  It pins NO rev (a 'rev' on a local entry is a parse error) and is
#       not fetched/SHA-gated — a checkout you control needs no blessed-SHA gate, and a repo
#       cannot pin its own post-commit hash.  See docs/install-manifest.md.
#   - duplicate repo names are rejected (no last-wins)

[[repo]]
name = "trailhead"
source = "local"   # install this working tree, tracking HEAD (no pinned rev — L-1)
tools = ["trailhead", "lore", "camp", "craft", "portage", "landing"]

# outpost is a personal dev tool (local PR / dev-env / deploy dashboard).
# Forward-declared here for completeness; uncomment and set a rev to enable.
# [[repo]]
# name = "outpost"
# rev = ""  # pin a 40-char SHA before enabling
# source = "https://github.com/tduffield/outpost"
# tools = ["outpost"]
